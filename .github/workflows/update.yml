name: auto-update

on:
  schedule:
    # 每 3 天 18:00（北京时间）= 10:00 UTC
    - cron: '0 10 */3 * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auto-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Refresh weather & timestamp
        run: python3 scripts/update_weather.py
      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --staged --quiet; then
            echo "no changes to commit"
          else
            git commit -m "auto: weather refresh $(date -u +%F)"
            git push
          fi
